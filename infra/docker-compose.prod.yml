# Produção em um VPS: Caddy (único ingress público) + API + PostgreSQL 17 + backup diário.
# Uso: docker compose --env-file .env -f infra/docker-compose.prod.yml up -d --build
# Só as portas 80/443 do serviço `web` ficam expostas; banco e API são privados.
name: vellor

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-vellor}
      POSTGRES_PASSWORD: '${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}'
      POSTGRES_DB: ${POSTGRES_DB:-vellor}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-vellor} -d ${POSTGRES_DB:-vellor}']
      interval: 10s
      timeout: 5s
      retries: 10
    logging:
      driver: json-file
      options: { max-size: '10m', max-file: '3' }

  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    image: vellor-api:latest
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      NODE_ENV: production
      PORT: '3001'
      DATABASE_URL: postgres://${POSTGRES_USER:-vellor}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-vellor}
      RUN_MIGRATIONS: 'true'
      TRUST_PROXY: 'true'
      STORAGE_LOCAL_DIR: /data/uploads
      SWAGGER_ENABLED: 'false'
    volumes:
      - uploads:/data/uploads
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - internal
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:3001/ready >/dev/null || exit 1']
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    logging:
      driver: json-file
      options: { max-size: '20m', max-file: '5' }

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
    image: vellor-web:latest
    restart: unless-stopped
    environment:
      # DOMAIN=loja.exemplo.com.br em produção; DOMAIN=:80 para testar sem TLS
      DOMAIN: '${DOMAIN:?defina DOMAIN no .env}'
      ACME_EMAIL: '${ACME_EMAIL:-admin@example.com}'
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api
    networks:
      - internal
    logging:
      driver: json-file
      options: { max-size: '20m', max-file: '5' }

  # Backup diário do banco (pg_dump no formato custom) com retenção configurável.
  backup:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER:-vellor}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB:-vellor}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
    volumes:
      - backups:/backups
      - ./postgres/backup.sh:/backup.sh:ro
    entrypoint: ['/bin/sh', '/backup.sh']
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - internal

networks:
  internal:
    driver: bridge

volumes:
  pgdata:
  uploads:
  caddy_data:
  caddy_config:
  backups:

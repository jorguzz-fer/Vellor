# Deploy com Coolify (build pack "Docker Compose").
# No Coolify: Base Directory "/", Docker Compose Location "/docker-compose.coolify.yml".
# Passo a passo: docs/runbook-coolify.md
#
# Diferenças em relação ao infra/docker-compose.prod.yml:
#   - o proxy do Coolify faz o TLS e publica o domínio; por isso o serviço `web` não abre
#     portas no host e o Caddy interno atende só HTTP na porta 80 (DOMAIN=:80);
#   - não há env_file: as variáveis vêm da aba "Environment Variables" do Coolify;
#   - o script de backup está embutido (sem bind mount de arquivo do repositório);
#   - caminhos relativos à raiz do repositório.

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-vellor}
      POSTGRES_PASSWORD: '${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD nas variáveis do Coolify}'
      POSTGRES_DB: ${POSTGRES_DB:-vellor}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-vellor} -d ${POSTGRES_DB:-vellor}']
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: '3001'
      # Para usar um PostgreSQL gerenciado pelo Coolify, defina DATABASE_URL nas variáveis
      DATABASE_URL: '${DATABASE_URL:-postgres://${POSTGRES_USER:-vellor}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-vellor}}'
      RUN_MIGRATIONS: 'true'
      TRUST_PROXY: 'true'
      STORAGE_LOCAL_DIR: /data/uploads
      SWAGGER_ENABLED: 'false'
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # --- Obrigatórias ---
      APP_URL: '${APP_URL:?defina APP_URL, ex. https://loja.exemplo.com.br}'
      APP_ENCRYPTION_KEY: '${APP_ENCRYPTION_KEY:?defina APP_ENCRYPTION_KEY (openssl rand -base64 48)}'
      # --- Primeiro administrador (criado na inicialização se ainda não existir) ---
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      ADMIN_NAME: ${ADMIN_NAME:-Administrador}
      # --- Sessões e cookies ---
      SESSION_TTL_DAYS: ${SESSION_TTL_DAYS:-30}
      ADMIN_SESSION_TTL_HOURS: ${ADMIN_SESSION_TTL_HOURS:-12}
      COOKIE_DOMAIN: ${COOKIE_DOMAIN:-}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-}
      # --- Asaas (obrigatório em produção; PAYMENTS_MOCK=true só para homologar sem cobrança) ---
      ASAAS_API_KEY: ${ASAAS_API_KEY:-}
      ASAAS_ENV: ${ASAAS_ENV:-sandbox}
      ASAAS_WEBHOOK_TOKEN: ${ASAAS_WEBHOOK_TOKEN:-}
      PAYMENTS_MOCK: ${PAYMENTS_MOCK:-false}
      # --- Correios (opcional; sem credenciais usa a tabela configurada no Admin) ---
      CORREIOS_USER: ${CORREIOS_USER:-}
      CORREIOS_ACCESS_CODE: ${CORREIOS_ACCESS_CODE:-}
      CORREIOS_POSTAGE_CARD: ${CORREIOS_POSTAGE_CARD:-}
      # --- E-mail transacional ---
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      MAIL_FROM: '${MAIL_FROM:-Vellor <no-reply@vellor.com.br>}'
      # --- Imagens: local (volume abaixo) ou s3 (R2/S3/MinIO) ---
      STORAGE_DRIVER: ${STORAGE_DRIVER:-local}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_REGION: ${S3_REGION:-auto}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      S3_PUBLIC_URL: ${S3_PUBLIC_URL:-}
      # --- Observabilidade (opcional) ---
      SENTRY_DSN: ${SENTRY_DSN:-}
      METRICS_TOKEN: ${METRICS_TOKEN:-}
    volumes:
      - uploads:/data/uploads
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:3001/ready >/dev/null || exit 1']
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    environment:
      # O TLS é do proxy do Coolify: o Caddy interno só serve HTTP na porta 80
      DOMAIN: ':80'
      ACME_EMAIL: ${ACME_EMAIL:-admin@example.com}
    expose:
      - '80'
    depends_on:
      - api

  # Backup diário do banco (pg_dump no formato custom) com retenção em dias.
  # Mesmo comportamento de infra/postgres/backup.sh, embutido para não depender de bind mount.
  backup:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER:-vellor}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB:-vellor}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
    volumes:
      - backups:/backups
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint: ['/bin/sh', '-c']
    command:
      - |
        set -eu
        mkdir -p /backups
        while true; do
          STAMP="$$(date -u +%Y%m%dT%H%M%SZ)"
          FILE="/backups/$${PGDATABASE}-$${STAMP}.dump"
          if pg_dump -Fc -f "$$FILE.tmp"; then
            mv "$$FILE.tmp" "$$FILE"
            echo "[backup] ok: $$FILE ($$(du -h "$$FILE" | cut -f1))"
            find /backups -name "$${PGDATABASE}-*.dump" -type f -mtime +"$$BACKUP_KEEP_DAYS" -delete
          else
            echo "[backup] FALHA em $$STAMP" >&2
            rm -f "$$FILE.tmp"
          fi
          sleep "$$BACKUP_INTERVAL_SECONDS"
        done

volumes:
  pgdata:
  uploads:
  backups:
